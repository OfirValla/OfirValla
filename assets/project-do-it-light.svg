<svg xmlns="http://www.w3.org/2000/svg" width="500" height="246" viewBox="0 0 500 246" fill="none" role="img">
<title>Do It: A reminder app that won't stop reminding you until it's done. Native alarms survive app kills, Doze and reboots, and can ring like an alarm clock until you tap Done.</title>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.glow { transform-box: fill-box; transform-origin: center; animation: breathe 9s ease-in-out infinite alternate; }
@keyframes breathe { from { transform: scale(0.9); } to { transform: scale(1.2); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
