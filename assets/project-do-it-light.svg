<text class="mono" x="104" y="76" font-size="12" fill="#7d8299">OfirValla/do-it</text>
<circle cx="444" cy="57" r="17" fill="#f6f5fc" stroke="#e6e3f3"/>
<g transform="translate(436 49) scale(0.67)" fill="none" stroke="#4a4f68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10" /> <path d="M7 17 17 7" /></g>
<text x="38" y="114" font-size="14" fill="#4a4f68">A reminder app that won't stop reminding you until it's</text>
