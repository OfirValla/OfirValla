<svg xmlns="http://www.w3.org/2000/svg" width="500" height="246" viewBox="0 0 500 246" fill="none" role="img">
<title>LabelStamp: Chrome extension that stamps the same labels onto every task in a Label Studio queue. It reads the project config, asks once, and labels the whole batch for you.</title>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.glow { transform-box: fill-box; transform-origin: center; animation: breathe 9s ease-in-out infinite alternate; }
@keyframes breathe { from { transform: scale(0.9); } to { transform: scale(1.2); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<clipPath id="card-clip"><rect x="14" y="8" width="472" height="220" rx="20"/></clipPath>
<linearGradient id="card-edge" x1="14" y1="8" x2="486" y2="228" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#7c3aed" stop-opacity="0.7"/>
  <stop offset="0.5" stop-color="#e6e3f3"/>
  <stop offset="1" stop-color="#e6e3f3"/>
</linearGradient>
<filter id="card-blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="40"/></filter>
<filter id="card-shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#3b2f7a" flood-opacity="0.1"/></filter>
<linearGradient id="tile" x1="38" y1="32" x2="88" y2="82" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#7c3aed"/>
  <stop offset="1" stop-color="#2563eb"/>
</linearGradient>
</defs>
<rect x="14" y="8" width="472" height="220" rx="20" fill="#ffffff" filter="url(#card-shadow)"/>
<g clip-path="url(#card-clip)">
  <circle class="glow" cx="436" cy="18" r="130" fill="#7c3aed" opacity="0.16" filter="url(#card-blur)"/>
</g>
<rect x="14.5" y="8.5" width="471" height="219" rx="19.5" stroke="url(#card-edge)"/>

<rect x="38" y="32" width="50" height="50" rx="14" fill="url(#tile)"/>
<rect x="38.5" y="32.5" width="49" height="49" rx="13.5" stroke="#ffffff" stroke-opacity="0.22"/>
<g transform="translate(50 44) scale(1.08)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 22h14" /> <path d="M19.27 13.73A2.5 2.5 0 0 0 17.5 13h-11A2.5 2.5 0 0 0 4 15.5V17a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1.5c0-.66-.26-1.3-.73-1.77Z" /> <path d="M14 13V8.5C14 7 15 7 15 5a3 3 0 0 0-3-3c-1.66 0-3 1-3 3s1 2 1 3.5V13" /></g>
<text x="104" y="55" font-size="20" font-weight="700" fill="#151829">LabelStamp</text>
<text class="mono" x="104" y="76" font-size="12" fill="#7d8299">OfirValla/LabelStamp</text>
<circle cx="444" cy="57" r="17" fill="#f6f5fc" stroke="#e6e3f3"/>
<g transform="translate(436 49) scale(0.67)" fill="none" stroke="#4a4f68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10" /> <path d="M7 17 17 7" /></g>
<text x="38" y="114" font-size="14" fill="#4a4f68">Chrome extension that stamps the same labels onto every</text>
<text x="38" y="136" font-size="14" fill="#4a4f68">task in a Label Studio queue. It reads the project config,</text>
<text x="38" y="158" font-size="14" fill="#4a4f68">asks once, and labels the whole batch for you.</text>
<rect x="38" y="180" width="89" height="24" rx="12" fill="#f6f5fc" stroke="#e6e3f3"/><text class="mono" x="82.5" y="196.03" text-anchor="middle" font-size="11.5" fill="#4a4f68">JavaScript</text>
<rect x="135" y="180" width="130.4" height="24" rx="12" fill="#f6f5fc" stroke="#e6e3f3"/><text class="mono" x="200.2" y="196.03" text-anchor="middle" font-size="11.5" fill="#4a4f68">Chrome Extension</text>
<rect x="273.4" y="180" width="102.8" height="24" rx="12" fill="#f6f5fc" stroke="#e6e3f3"/><text class="mono" x="324.8" y="196.03" text-anchor="middle" font-size="11.5" fill="#4a4f68">Label Studio</text>
</svg>