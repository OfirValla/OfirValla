<rect x="239.3" y="180" width="116.6" height="24" rx="12" fill="#161b33" stroke="#262c4a"/><text class="mono" x="297.6" y="196.03" text-anchor="middle" font-size="11.5" fill="#a9b0cc">Home Assistant</text>
