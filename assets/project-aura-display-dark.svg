  <stop offset="0" stop-color="#22d3ee" stop-opacity="0.7"/>
  <stop offset="0.5" stop-color="#262c4a"/>
  <stop offset="1" stop-color="#262c4a"/>
</linearGradient>
<filter id="card-blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="40"/></filter>

<linearGradient id="tile" x1="38" y1="32" x2="88" y2="82" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#0891b2"/>
  <stop offset="1" stop-color="#2563eb"/>
</linearGradient>
</defs>
<rect x="14" y="8" width="472" height="220" rx="20" fill="#0f1324"/>
<g clip-path="url(#card-clip)">
  <circle class="glow" cx="436" cy="18" r="130" fill="#22d3ee" opacity="0.32" filter="url(#card-blur)"/>
</g>
<rect x="14.5" y="8.5" width="471" height="219" rx="19.5" stroke="url(#card-edge)"/>

<rect x="38" y="32" width="50" height="50" rx="14" fill="url(#tile)"/>
<rect x="38.5" y="32.5" width="49" height="49" rx="13.5" stroke="#ffffff" stroke-opacity="0.22"/>
<g transform="translate(50 44) scale(1.08)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="10" height="14" x="3" y="8" rx="2" /> <path d="M5 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2h-2.4" /> <path d="M8 18h.01" /></g>
<text x="104" y="55" font-size="20" font-weight="700" fill="#eef0fb">Aura Display</text>
<text class="mono" x="104" y="76" font-size="12" fill="#6f7694">OfirValla/Wallflower</text>
<circle cx="444" cy="57" r="17" fill="#161b33" stroke="#262c4a"/>
<g transform="translate(436 49) scale(0.67)" fill="none" stroke="#a9b0cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10" /> <path d="M7 17 17 7" /></g>
<text x="38" y="114" font-size="14" fill="#a9b0cc">Turns a wall-mounted Android tablet into an always-on,</text>
<text x="38" y="136" font-size="14" fill="#a9b0cc">locked-down Home Assistant dashboard, with MQTT discovery</text>
<text x="38" y="158" font-size="14" fill="#a9b0cc">and camera-based motion wake. Flutter UI, Kotlin core.</text>
